<!DOCTYPE html>

<title>Institute Logo Belt</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: transparent;
    font-family: Arial, sans-serif;
}

/* =========================
   LOGO BELT
========================= */

.logo-section {
    width: 100%;
    overflow: hidden;
    padding: 15px 0;
    background: transparent;
}

/* Moving belt */

.logo-track {
    display: flex;
    width: max-content;
    animation: logoScroll 35s linear infinite;
}

/* Groups */

.logo-group {
    display: flex;
    align-items: center;
}

/* Individual logo container */

.logo-box {
    width: 145px;
    height: 95px;

    margin: 0 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    border-radius: 10px;

    padding: 10px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.08);

    flex-shrink: 0;
}

/* Logo */

.logo-box img {
    width: auto;
    height: auto;

    max-width: 120px;
    max-height: 72px;

    object-fit: contain;

    display: block;
}


/* =========================
   INFINITE SCROLL
========================= */

@keyframes logoScroll {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }

}


/* =========================
   HOVER PAUSE
========================= */

.logo-section:hover .logo-track {
    animation-play-state: paused;
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

    .logo-box {
        width: 125px;
        height: 85px;
        margin: 0 14px;
    }

    .logo-box img {
        max-width: 100px;
        max-height: 60px;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .logo-section {
        padding: 10px 0;
    }

    .logo-box {
        width: 105px;
        height: 72px;
        margin: 0 10px;
        padding: 7px;
    }

    .logo-box img {
        max-width: 85px;
        max-height: 52px;
    }

}

</style>
</head>
