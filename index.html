<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
}

/* =========================
   BELT
========================= */

.logo-belt {
    width: 100%;
    height: 180px;
    overflow: hidden;
    background: #ffffff;

    display: flex;
    align-items: center;
}

/* =========================
   TRACK
========================= */

.logo-track {
    display: flex;
    align-items: center;
    width: max-content;

    animation: scroll 45s linear infinite;
}

.logo-belt:hover .logo-track {
    animation-play-state: paused;
}

/* =========================
   LOGO BOX
   EXACTLY 140 × 100 PX
========================= */

.logo-item {
    width: 140px;
    height: 100px;

    margin-left: 15px;
    margin-right: 15px;

    flex: 0 0 140px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    border-radius: 8px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.08);

    overflow: hidden;
}

/* =========================
   LARGE LOGOS
========================= */

.logo-item img {
    width: auto;
    height: auto;

    max-width: 138px;
    max-height: 98px;

    object-fit: contain;

    display: block;
}

/* =========================
   INFINITE MOVEMENT
========================= */

@keyframes scroll {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .logo-belt {
        height: 150px;
    }

    .logo-item {
        width: 140px;
        height: 100px;

        flex-basis: 140px;

        margin-left: 10px;
        margin-right: 10px;
    }

    .logo-item img {
        max-width: 138px;
        max-height: 98px;
    }

    .logo-track {
        animation-duration: 35s;
    }
}
</style>

</head>
