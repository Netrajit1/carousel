<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
}

/* =========================
   LARGE LOGO BELT
========================= */

.logo-belt {
    width: 100%;
    height: 230px;
    overflow: hidden;
    background: #ffffff;

    display: flex;
    align-items: center;
}

/* =========================
   MOVING TRACK
========================= */

.logo-track {
    display: flex;
    align-items: center;
    width: max-content;

    animation: scroll 50s linear infinite;
}

.logo-belt:hover .logo-track {
    animation-play-state: paused;
}

/* =========================
   LARGE UNIFORM BOX
========================= */

.logo-item {
    width: 200px;
    height: 140px;

    flex: 0 0 200px;

    margin: 0 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    border-radius: 12px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.12);

    overflow: hidden;
}

/* =========================
   LARGE LOGOS
========================= */

.logo-item img {
    max-width: 185px;
    max-height: 125px;

    width: auto;
    height: auto;

    object-fit: contain;

    display: block;
}

/* =========================
   INFINITE SCROLL
========================= */

@keyframes scroll {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .logo-belt {
        height: 190px;
    }

    .logo-item {
        width: 175px;
        height: 125px;

        flex-basis: 175px;

        margin: 0 12px;
    }

    .logo-item img {
        max-width: 162px;
        max-height: 112px;
    }

    .logo-track {
        animation-duration: 40s;
    }
}
</style>
