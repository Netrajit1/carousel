<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
}

/* =========================
   LOGO BELT
========================= */

.logo-belt {
    width: 100%;
    height: 230px;              /* INCREASED HEIGHT */
    overflow: hidden;
    background: #ffffff;
    padding: 20px 0;
    display: flex;
    align-items: center;
}

/* =========================
   MOVING TRACK
========================= */

.logo-track {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;

    animation: scroll 45s linear infinite;
}

.logo-belt:hover .logo-track {
    animation-play-state: paused;
}

/* =========================
   LOGO BOX
========================= */

.logo-item {
    width: 210px;
    height: 190px;

    margin: 0 18px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    border-radius: 12px;

    box-shadow:
        0 4px 14px rgba(0,0,0,0.10);

    overflow: hidden;
}

/* =========================
   LOGOS
========================= */

.logo-item img {
    width: 165px;
    height: 165px;

    object-fit: contain;

    display: block;

    /* Prevents distorted logos */
    max-width: 100%;
    max-height: 100%;
}

/* =========================
   SMOOTH INFINITE SCROLL
========================= */

@keyframes scroll {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }

}

/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .logo-belt {
        height: 210px;
    }

    .logo-item {
        width: 190px;
        height: 175px;
        margin: 0 15px;
    }

    .logo-item img {
        width: 150px;
        height: 150px;
    }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .logo-belt {
        height: 175px;
        padding: 15px 0;
    }

    .logo-item {
        width: 155px;
        height: 145px;
        margin: 0 10px;

        border-radius: 10px;
    }

    .logo-item img {
        width: 120px;
        height: 120px;
    }

    .logo-track {
        animation-duration: 35s;
    }

}
</style>
