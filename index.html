    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           MAIN LOGO BELT
        ========================================= */

        .logo-belt {
            width: 100%;
            overflow: hidden;

            background: #ffffff;

            padding: 15px 0;

            position: relative;
        }


        /* =========================================
           MOVING TRACK
        ========================================= */

        .logo-track {
            display: flex;

            width: max-content;

            align-items: center;

            animation: logoScroll 38s linear infinite;

            will-change: transform;
        }


        /* Pause when mouse is over the belt */

        .logo-belt:hover .logo-track {
            animation-play-state: paused;
        }


        /* =========================================
           INDIVIDUAL LOGO CONTAINER
        ========================================= */

        .logo-item {

            width: 180px;
            height: 110px;

            margin: 0 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            background: #ffffff;

            border-radius: 8px;
        }


        /* =========================================
           LOGO IMAGE
        ========================================= */

        .logo-item img {

            width: auto;
            height: auto;

            max-width: 145px;
            max-height: 82px;

            object-fit: contain;

            display: block;

            transition: transform 0.3s ease;
        }


        /* Slight enlargement when hovering */

        .logo-item:hover img {
            transform: scale(1.08);
        }


        /* =========================================
           INFINITE SCROLL ANIMATION
        ========================================= */

        @keyframes logoScroll {

            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .logo-belt {
                padding: 10px 0;
            }

            .logo-item {

                width: 140px;
                height: 90px;

                margin: 0 10px;
            }

            .logo-item img {

                max-width: 110px;
                max-height: 62px;
            }

            .logo-track {
                animation-duration: 28s;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

                height: 80px;

                margin: 0 8px;
            }

            .logo-item img {
