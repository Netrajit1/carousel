<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
}

/* =========================
   LOGO BELT
========================= */

.logo-belt {
    width: 100%;
    height: 180px;
    overflow: hidden;
    background: #ffffff;

    display: flex;
    align-items: center;
}

/* =========================
   MOVING TRACK
========================= */

.logo-track {
    display: flex;
    align-items: center;
    width: max-content;

    animation: scroll 45s linear infinite;
}

.logo-belt:hover .logo-track {
    animation-play-state: paused;
}

/* =========================
   LOGO BOX
   EXACT SIZE: 140 × 100 PX
========================= */

.logo-item {
    width: 140px;
    height: 100px;

    margin: 0 15px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    border-radius: 8px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.08);

    overflow: hidden;
}

/* =========================
   LOGO IMAGE
========================= */

.logo-item img {
    width: 120px;
    height: 80px;

    object-fit: contain;

    display: block;
}

/* =========================
   INFINITE SCROLL
========================= */

@keyframes scroll {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .logo-belt {
        height: 150px;
    }

    .logo-item {
        width: 140px;
        height: 100px;

        margin: 0 10px;
    }

    .logo-item img {
        width: 120px;
        height: 80px;
    }

    .logo-track {
        animation-duration: 35s;
    }

}
</style>

</head>
