<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow: hidden;
    background: transparent;
}

.logo-section {
    width: 100%;
    overflow: hidden;
    padding: 15px 0;
}

.logo-track {
    display: flex;
    width: max-content;
    animation: scroll 40s linear infinite;
}

.logo-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.logo-box {
    width: 150px;
    height: 100px;
    margin: 0 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: white;
    border-radius: 10px;

    padding: 12px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.10);

    flex-shrink: 0;
}

.logo-box img {
    max-width: 120px;
    max-height: 75px;

    width: auto;
    height: auto;

    object-fit: contain;
}

/* Continuous movement */

@keyframes scroll {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }

}

/* Pause */

.logo-section:hover .logo-track {
    animation-play-state: paused;
}

/* Mobile */

@media(max-width:600px) {

    .logo-box {
        width: 110px;
        height: 75px;
        margin: 0 10px;
        padding: 8px;
    }

    .logo-box img {
        max-width: 90px;
        max-height: 55px;
    }

}
</style>
</head>
